<!-- One page in the source list. Filled in by ui/research.py.
     $icon is the site's favicon drawn as a background; where a site has
     none, the letter underneath stays visible. -->
<a class="gw-source" href="$url" target="_blank" rel="noopener noreferrer" title="$title">
    <span class="gw-source-number">$number</span>
    <span class="gw-source-icon">$letter$icon</span>
    <span class="gw-source-text">
        <span class="gw-source-title">$title</span>
        <span class="gw-source-site"><code>$domain</code>$badge</span>
    </span>
</a>
